name: Dependabot Changesets

on:
  # This privileged trigger is restricted to Dependabot-authored branches in
  # this repository, and no pull-request code is checked out or executed.
  pull_request_target: # zizmor: ignore[dangerous-triggers]
    branches:
      - main
    types: [opened, synchronize]

permissions:
  contents: write
  pull-requests: write

jobs:
  generate-changeset:
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Create changeset
        uses: mscharley/dependency-changesets-action@874dac2372a085cb94f750e8bdf5b1173a838a75 # v1.2.5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
