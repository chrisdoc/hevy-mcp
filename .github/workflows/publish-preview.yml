name: Publish npm preview

on:
  workflow_run:
    workflows: ["Build and Test"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  id-token: write

env:
  ROLLUP_SKIP_NODEJS_NATIVE_BUILD: "true"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  publish:
    name: Publish hevy-mcp preview
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build

      - name: Set transient preview version
        env:
          PREVIEW_ID: ${{ github.event.workflow_run.id }}
          PREVIEW_ATTEMPT: ${{ github.run_attempt }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";

          const path = "packages/node/package.json";
          const packageJson = JSON.parse(readFileSync(path, "utf8"));
          const baseVersion = packageJson.version.split("-")[0];
          packageJson.version = `${baseVersion}-main.${process.env.PREVIEW_ID}.${process.env.PREVIEW_ATTEMPT}`;
          writeFileSync(path, `${JSON.stringify(packageJson, null, "\t")}\n`);
          NODE
          npm run sync:server-manifest

      - name: Verify package
        run: npm run test:pack

      - name: Publish preview
        env:
          PREVIEW_ID: ${{ github.event.workflow_run.id }}
          PREVIEW_ATTEMPT: ${{ github.run_attempt }}
        run: |
          VERSION=$(node -p 'JSON.parse(require("node:fs").readFileSync("packages/node/package.json", "utf8")).version')
          case "$VERSION" in
            *-main.*) ;;
            *)
              echo "Refusing to publish non-preview version: $VERSION"
              exit 1
              ;;
          esac
          echo "Publishing hevy-mcp@$VERSION with the preview dist-tag"
          npm publish --workspace=hevy-mcp --tag preview
