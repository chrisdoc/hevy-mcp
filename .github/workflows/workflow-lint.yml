name: Workflow Lint

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions: {}

jobs:
  actionlint:
    name: Lint workflow syntax
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up actionlint
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: "2026.7.12"
          install_args: actionlint

      - name: Run actionlint
        run: actionlint

  zizmor:
    name: Audit workflows and actions
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up zizmor
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: "2026.7.12"
          install_args: zizmor

      - name: Run zizmor
        run: zizmor --strict-collection --collect=default --format=github .

      - name: Generate zizmor SARIF report
        if: ${{ !cancelled() }}
        run: zizmor --strict-collection --collect=default --format=sarif --no-exit-codes . > zizmor.sarif

      - name: Upload zizmor report
        if: ${{ !cancelled() }}
        uses: github/codeql-action/upload-sarif@d1ba80a13dd99fba24a470575428917156a28b43 # v4.37.5
        with:
          sarif_file: zizmor.sarif
