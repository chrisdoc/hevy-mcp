name: Workflow Lint

on:
  push:
    branches:
      - main
  pull_request:
    # Stacked PRs target their parent branch, not only main.
  workflow_dispatch:

permissions: {}

jobs:
  actionlint:
    name: Lint workflow syntax
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up actionlint
        uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
        with:
          install_args: actionlint

      - name: Run actionlint
        run: actionlint

  zizmor:
    name: Audit workflows and actions
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up zizmor
        uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
        with:
          install_args: zizmor

      - name: Run zizmor
        run: zizmor --strict-collection --collect=default --format=github .

      - name: Generate zizmor SARIF report
        if: ${{ !cancelled() }}
        run: zizmor --strict-collection --collect=default --format=sarif --no-exit-codes . > zizmor.sarif

      - name: Upload zizmor report
        if: ${{ !cancelled() }}
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: zizmor.sarif
