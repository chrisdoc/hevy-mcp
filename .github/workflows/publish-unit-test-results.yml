name: Publish Unit Test Results

on:
  # This privileged follow-up never checks out or executes pull-request code;
  # it only publishes artifacts produced by the unprivileged test workflow.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows:
      - Build and Test
    types:
      - completed

permissions:
  actions: read
  checks: write
  contents: read
  pull-requests: write

jobs:
  publish:
    name: Publish unit test results
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      (github.event.workflow_run.conclusion == 'success' ||
      github.event.workflow_run.conclusion == 'failure')
    runs-on: ubuntu-latest
    steps:
      - name: Download source workflow artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          path: artifacts

      - name: Publish unit test results
        if: ${{ hashFiles('artifacts/unit-test-results-node-24/*.xml') != '' }}
        uses: EnricoMi/publish-unit-test-result-action/linux@7622c5bf3d112a72ab4fa3951c2aa5723d8ab92d # v2.25.0
        with:
          github_token: ${{ github.token }}
          commit: ${{ github.event.workflow_run.head_sha }}
          event_file: artifacts/source-event/event.json
          event_name: ${{ github.event.workflow_run.event }}
          files: artifacts/unit-test-results-node-24/*.xml
          check_name: Unit Test Results
          comment_title: Unit Test Results
          comment_mode: always
