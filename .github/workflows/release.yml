name: Release

on:
  workflow_run:
    workflows: ["Build and Test"]
    types: [completed]
    branches: [main]
permissions:
  contents: write # needed to create releases/tags

env:
  ROLLUP_SKIP_NODEJS_NATIVE_BUILD: "true"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  release:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: write # to be able to publish a GitHub release
      issues: write # to be able to comment on released issues
      pull-requests: write # to be able to comment on released pull requests
      id-token: write # to enable use of OIDC for npm provenance
    outputs:
      version: ${{ steps.release.outputs.version }}
      released: ${{ steps.release.outputs.released }}
      worker_released: ${{ steps.release.outputs.worker_released }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - run: npm ci
      - run: npm run build
        env:
          HEVY_MCP_RELEASE: "true"
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          OTEL_COLLECTOR_TOKEN: ${{ secrets.OTEL_COLLECTOR_TOKEN }}
      - name: Run unit tests
        run: npx vitest run --exclude 'tests/integration/**'
      - name: Verify published package
        run: npm run test:pack
      - name: Run integration tests
        run: npx vitest run tests/integration
        env:
          HEVY_API_KEY: ${{ secrets.HEVY_API_KEY }}

      - name: Test source MCP build
        run: node tests/nightly/test_hevy_mcp.mjs
        env:
          HEVY_API_KEY: ${{ secrets.HEVY_API_KEY }}
          HEVY_MCP_COMMAND: node
          HEVY_MCP_ARGS_JSON: '["packages/node/dist/cli.mjs"]'
          HEVY_MCP_LAUNCHER: release-source
          HEVY_MCP_SOURCE_REVISION: ${{ github.sha }}
          HEVY_MCP_DIAGNOSTICS_PATH: test-results/release-source.json

      - name: Smoke test live local Worker HTTP path
        continue-on-error: true
        run: npm run test:worker-http:live
        env:
          HEVY_API_KEY: ${{ secrets.HEVY_API_KEY }}
          HEVY_RUN_LIVE_WORKER_TESTS: "1"

      - name: Create Release PR or Publish
        id: changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          version: npm run version:changesets
          publish: npm run release
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          OTEL_COLLECTOR_TOKEN: ${{ secrets.OTEL_COLLECTOR_TOKEN }}
          HEVY_MCP_RELEASE: "true"
      - name: Set Release Outputs
        id: release
        run: |
          set -euo pipefail
          worker_released=false
          if ! git diff --quiet \
            "${{ github.event.workflow_run.head_sha || github.sha }}^1" \
            "${{ github.event.workflow_run.head_sha || github.sha }}" \
            -- packages/worker/package.json; then
            worker_released=true
          fi

          if [ "${{ steps.changesets.outputs.published }}" = "true" ]; then
            VERSION=$(node -p 'const pkgs = JSON.parse(process.env.PKGS); pkgs.find((pkg) => pkg.name === "hevy-mcp")?.version || ""')
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "released=true" >> "$GITHUB_OUTPUT"
          else
            echo "version=" >> "$GITHUB_OUTPUT"
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi
          echo "worker_released=$worker_released" >> "$GITHUB_OUTPUT"
        env:
          PKGS: ${{ steps.changesets.outputs.publishedPackages }}

  publish-container:
    name: Publish Docker image
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout tested release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Docker image metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable=${{ !contains(needs.release.outputs.version, '-') }}
            type=semver,pattern={{version}},value=${{ needs.release.outputs.version }}
            type=semver,pattern={{major}},value=${{ needs.release.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release.outputs.version }}

      - name: Build and publish Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}

  deploy-production:
    name: Deploy production Worker
    needs: release
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      (needs.release.outputs.released == 'true' ||
      needs.release.outputs.worker_released == 'true')
    runs-on: ubuntu-latest
    concurrency:
      group: cloudflare-worker-production
      cancel-in-progress: false
    environment:
      name: production
      url: https://hevy.chrisdoc.dev/mcp
    steps:
      - name: Checkout published release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Deploy published version
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRANGLER_MODE: production
          CLOUDFLARE_WORKER_NAME: ${{ vars.CLOUDFLARE_WORKER_NAME }}
          CLOUDFLARE_WORKER_ROUTE: ${{ vars.CLOUDFLARE_WORKER_ROUTE }}
          CLOUDFLARE_OTEL_LOGS_DESTINATIONS: ${{ vars.CLOUDFLARE_OTEL_LOGS_DESTINATIONS }}
          CLOUDFLARE_OTEL_TRACES_DESTINATIONS: ${{ vars.CLOUDFLARE_OTEL_TRACES_DESTINATIONS }}
          CLOUDFLARE_OAUTH_KV_NAMESPACE_ID: ${{ secrets.CLOUDFLARE_OAUTH_KV_NAMESPACE_ID }}
        run: >-
          npx wrangler deploy
          --x-new-config
          --env production
          --message "Changesets release at ${{ github.event.workflow_run.head_sha || github.sha }}"
