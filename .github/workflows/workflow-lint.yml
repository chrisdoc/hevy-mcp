name: Workflow Lint

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions: {}

jobs:
  actionlint:
    name: Lint workflow syntax
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up actionlint
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          version: "2026.7.12"
          install_args: actionlint

      - name: Run actionlint
        run: actionlint

  zizmor:
    name: Audit workflows and actions
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up zizmor
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          version: "2026.7.12"
          install_args: zizmor

      - name: Run zizmor
        run: zizmor --strict-collection --collect=default --format=github .

      - name: Generate zizmor SARIF report
        if: ${{ !cancelled() }}
        run: zizmor --strict-collection --collect=default --format=sarif --no-exit-codes . > zizmor.sarif

      - name: Upload zizmor report
        if: ${{ !cancelled() }}
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          sarif_file: zizmor.sarif
