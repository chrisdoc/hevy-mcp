name: Nightly MCP Integration Test

on:
  schedule:
    # Run every night at 2:00 AM UTC
    - cron: "0 2 * * *"
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  mcp-integration-test:
    name: MCP integration test (${{ matrix.launcher.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        launcher:
          - name: npx
            id: npx
            command: npx
            args_json: '["-y", "hevy-mcp@latest"]'
            diagnostics_path: test-results/nightly-npx.json
          - name: bunx
            id: bunx
            command: bunx
            args_json: '["hevy-mcp@latest"]'
            diagnostics_path: test-results/nightly-bunx.json
          - name: source
            id: source
            command: node
            args_json: '["packages/node/dist/cli.mjs"]'
            diagnostics_path: test-results/nightly-source.json

    steps:
      - name: Checkout repository
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.0.0

      - name: Set up Node.js
        id: setup_node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"

      - name: Set up mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      - name: Install Node dependencies
        id: install_deps
        run: pnpm install --frozen-lockfile

      - name: Build local source
        if: matrix.launcher.name == 'source'
        run: npx nx run repository:build

      - name: Set up Bun
        if: matrix.launcher.command == 'bunx'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Run MCP integration test
        id: run_mcp_integration_test
        run: npx nx run repository:test:nightly
        env:
          HEVY_API_KEY: ${{ secrets.HEVY_API_KEY }}
          HEVY_MCP_COMMAND: ${{ matrix.launcher.command }}
          HEVY_MCP_ARGS_JSON: ${{ matrix.launcher.args_json }}
          HEVY_MCP_LAUNCHER: ${{ matrix.launcher.id }}
          HEVY_MCP_SOURCE_REVISION: ${{ matrix.launcher.id == 'source' && github.sha || '' }}
          HEVY_MCP_DIAGNOSTICS_PATH: ${{ matrix.launcher.diagnostics_path }}

      - name: Upload redacted nightly diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-diagnostics-${{ matrix.launcher.id }}
          path: ${{ matrix.launcher.diagnostics_path }}
          if-no-files-found: warn
          retention-days: 7

  report-nightly-failure:
    name: Alert on nightly failure
    if: ${{ always() && github.event_name == 'schedule' && needs.mcp-integration-test.result == 'failure' }}
    needs: [mcp-integration-test]
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Create one tracking issue per failure incident
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const title = "Nightly MCP integration failure";
            const openIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100,
            });
            if (openIssues.some((issue) => !issue.pull_request && issue.title === title)) {
              core.info("An open nightly failure issue already exists.");
              return;
            }
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body: [
                "The scheduled npx/bunx/source integration matrix failed.",
                "",
                `Workflow run: ${runUrl}`,
                "",
                "Review the redacted diagnostics artifacts in the run. Do not copy API keys, authorization headers, or workout data into this issue.",
              ].join("\n"),
            });
