name: Deploy Cloudflare Worker Preview

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - closed

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  preview:
    name: Deploy PR preview
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action != 'closed' &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: cloudflare-worker-preview-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    environment:
      name: preview
      url: ${{ steps.preview_url.outputs.url }}
    env:
      CLOUDFLARE_WORKER_NAME: ${{ vars.CLOUDFLARE_WORKER_NAME }}
      CLOUDFLARE_WORKER_ROUTE: ${{ vars.CLOUDFLARE_WORKER_ROUTE }}
      CLOUDFLARE_OTEL_LOGS_DESTINATIONS: ${{ vars.CLOUDFLARE_OTEL_LOGS_DESTINATIONS }}
      CLOUDFLARE_OTEL_TRACES_DESTINATIONS: ${{ vars.CLOUDFLARE_OTEL_TRACES_DESTINATIONS }}
      CLOUDFLARE_OAUTH_KV_NAMESPACE_ID: ${{ secrets.CLOUDFLARE_OAUTH_KV_NAMESPACE_ID }}

    steps:
      - name: Checkout pull request commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.0.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check whether the preview Worker exists
        id: preview_worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail

          response_body="$(mktemp)"
          trap 'rm -f "$response_body"' EXIT

          set +e
          http_status="$(
            curl \
              --silent \
              --show-error \
              --output "$response_body" \
              --write-out "%{http_code}" \
              --connect-timeout 10 \
              --max-time 30 \
              --request GET \
              --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              --header "Content-Type: application/json" \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${CLOUDFLARE_WORKER_NAME}/settings"
          )"
          curl_exit=$?
          set -e

          if (( curl_exit != 0 )); then
            echo "Cloudflare preview Worker existence check failed during transport (curl exit ${curl_exit})." >&2
            exit "$curl_exit"
          fi

          case "$http_status" in
            200)
              echo "bootstrap=false" >> "$GITHUB_OUTPUT"
              ;;
            404)
              echo "bootstrap=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Cloudflare preview Worker existence check returned unexpected HTTP ${http_status}; refusing to bootstrap." >&2
              exit 1
              ;;
          esac

      - name: Bootstrap dedicated preview Worker
        if: steps.preview_worker.outputs.bootstrap == 'true'
        env:
          CLOUDFLARE_PREVIEW_INERT: "true"
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: >-
          pnpm --dir packages/worker exec cf deploy
          --mode preview
          --message "Bootstrap inert ${CLOUDFLARE_WORKER_NAME} Worker for GitHub PR versions"

      - name: Resolve preview Worker version tag
        id: worker_version
        run: |
          tag="$(node scripts/resolve-worker-version.mjs preview \
            "${{ github.event.pull_request.number }}" \
            "${{ github.event.pull_request.head.sha }}")"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Upload preview version
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PREVIEW_ALIAS: pr-${{ github.event.pull_request.number }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.ndjson
          WORKER_VERSION_TAG: ${{ steps.worker_version.outputs.tag }}
        run: |
          # cf upload uses deploy-helpers' Wrangler-compatible NDJSON output.
          # Truncate to prevent stale entries from polluting version ID extraction
          : > "${WRANGLER_OUTPUT_FILE_PATH}"
          pnpm --dir packages/worker exec cf workers versions create \
            --mode preview \
            --preview-alias "${PREVIEW_ALIAS}" \
            --tag "${WORKER_VERSION_TAG}" \
            --message "GitHub PR #${PR_NUMBER} at ${HEAD_SHA}"

      - name: Activate preview version
        env:
          DEPLOYMENT_MESSAGE: "Activate GitHub PR #${{ github.event.pull_request.number }} preview"
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.ndjson
        run: |
          version_id="$(node <<'NODE'
          const fs = require("node:fs");

          const entries = fs
            .readFileSync(process.env.WRANGLER_OUTPUT_FILE_PATH, "utf8")
            .trim()
            .split("\n")
            .filter(Boolean)
            .map((line) => JSON.parse(line));
          const upload = entries.findLast(
            (entry) => entry.type === "version-upload",
          );
          const versionId = upload?.version_id ?? upload?.id;

          if (!versionId) {
            throw new Error(
              "cf did not return version_id; verify the preview version upload completed successfully",
            );
          }

          process.stdout.write(versionId);
          NODE
          )"
          deployment_body="$(VERSION_ID="$version_id" node -e '
            process.stdout.write(JSON.stringify({
              annotations: { "workers/message": process.env.DEPLOYMENT_MESSAGE },
              strategy: "percentage",
              versions: [{ version_id: process.env.VERSION_ID, percentage: 100 }],
            }));
          ')"
          for attempt in 1 2 3; do
            if pnpm --dir packages/worker exec cf workers deployments create \
              --worker "${CLOUDFLARE_WORKER_NAME}" \
              --body "${deployment_body}"; then
              break
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "::warning::cf workers deployments create attempt ${attempt} failed, retrying in 15s..."
              sleep 15
            else
              echo "::error::All 3 cf workers deployments create attempts failed."
              exit 1
            fi
          done

      - name: Publish preview URL
        id: preview_url
        env:
          EXPECTED_PREFIX: pr-${{ github.event.pull_request.number }}-${{ vars.CLOUDFLARE_WORKER_NAME }}.
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.ndjson
        run: |
          node <<'NODE'
          const fs = require("node:fs");

          const entries = fs
            .readFileSync(process.env.WRANGLER_OUTPUT_FILE_PATH, "utf8")
            .trim()
            .split("\n")
            .filter(Boolean)
            .map((line) => JSON.parse(line));
          const upload = entries.findLast(
            (entry) => entry.type === "version-upload",
          );
          const previewAliasUrl = upload?.preview_alias_url;

          if (!previewAliasUrl) {
            throw new Error(
              "cf did not return preview_alias_url; verify the preview alias upload completed successfully",
            );
          }

          const previewUrl = new URL(previewAliasUrl);

          if (
            previewUrl.protocol !== "https:" ||
            !previewUrl.hostname.startsWith(process.env.EXPECTED_PREFIX) ||
            !previewUrl.hostname.endsWith(".workers.dev")
          ) {
            throw new Error("cf did not return the expected preview alias URL");
          }

          const mcpUrl = new URL("/mcp", previewUrl);

          fs.appendFileSync(process.env.GITHUB_OUTPUT, `url=${mcpUrl.href}\n`);
          fs.appendFileSync(
            process.env.GITHUB_STEP_SUMMARY,
            [
              "## Cloudflare Worker preview",
              "",
              `- Alias: \`pr-${{ github.event.pull_request.number }}\``,
              `- MCP endpoint: ${mcpUrl.href}`,
              `- Commit: \`${{ github.event.pull_request.head.sha }}\``,
              "",
            ].join("\n"),
          );
          NODE

      - name: Create or update preview URL comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PREVIEW_URL: ${{ steps.preview_url.outputs.url }}
          PREVIEW_ALIAS: pr-${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const marker = "<!-- hevy-mcp-cloudflare-preview -->";
            const body = [
              marker,
              "## Cloudflare Worker preview",
              "",
              `- MCP endpoint: ${process.env.PREVIEW_URL}`,
              `- Alias: \`${process.env.PREVIEW_ALIAS}\``,
              `- Commit: \`${process.env.HEAD_SHA}\``,
              "",
            ].join("\n");
            const comments = await github.paginate(
              github.rest.issues.listComments,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                per_page: 100,
              },
            );
            const existing = comments.find(
              (comment) =>
                comment.user?.login === "github-actions[bot]" &&
                comment.body?.includes(marker),
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  cleanup-preview:
    name: Cleanup PR preview
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    concurrency:
      group: cloudflare-worker-preview-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    environment: preview
    env:
      CLOUDFLARE_WORKER_NAME: ${{ vars.CLOUDFLARE_WORKER_NAME }}
      CLOUDFLARE_WORKER_ROUTE: ${{ vars.CLOUDFLARE_WORKER_ROUTE }}
      CLOUDFLARE_OTEL_LOGS_DESTINATIONS: ${{ vars.CLOUDFLARE_OTEL_LOGS_DESTINATIONS }}
      CLOUDFLARE_OTEL_TRACES_DESTINATIONS: ${{ vars.CLOUDFLARE_OTEL_TRACES_DESTINATIONS }}
      CLOUDFLARE_OAUTH_KV_NAMESPACE_ID: ${{ secrets.CLOUDFLARE_OAUTH_KV_NAMESPACE_ID }}

    steps:
      - name: Checkout pull request commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.0.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Replace preview alias with inert Worker
        env:
          CLOUDFLARE_PREVIEW_INERT: "true"
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-cleanup-output.ndjson
        run: |
          # cf upload uses deploy-helpers' Wrangler-compatible NDJSON output.
          # Truncate to prevent stale entries from polluting version ID extraction
          : > "${WRANGLER_OUTPUT_FILE_PATH}"
          pnpm --dir packages/worker exec cf workers versions create \
            --mode preview \
            --preview-alias pr-${{ github.event.pull_request.number }} \
            --message "Cleanup GitHub PR #${{ github.event.pull_request.number }} after merge"

      - name: Activate inert cleanup version
        env:
          DEPLOYMENT_MESSAGE: "Activate inert cleanup for GitHub PR #${{ github.event.pull_request.number }}"
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-cleanup-output.ndjson
        run: |
          version_id="$(node <<'NODE'
          const fs = require("node:fs");

          const entries = fs
            .readFileSync(process.env.WRANGLER_OUTPUT_FILE_PATH, "utf8")
            .trim()
            .split("\n")
            .filter(Boolean)
            .map((line) => JSON.parse(line));
          const upload = entries.findLast(
            (entry) => entry.type === "version-upload",
          );
          const versionId = upload?.version_id ?? upload?.id;

          if (!versionId) {
            throw new Error(
              "cf did not return version_id; verify the cleanup version upload completed successfully",
            );
          }

          process.stdout.write(versionId);
          NODE
          )"
          deployment_body="$(VERSION_ID="$version_id" node -e '
            process.stdout.write(JSON.stringify({
              annotations: { "workers/message": process.env.DEPLOYMENT_MESSAGE },
              strategy: "percentage",
              versions: [{ version_id: process.env.VERSION_ID, percentage: 100 }],
            }));
          ')"
          for attempt in 1 2 3; do
            if pnpm --dir packages/worker exec cf workers deployments create \
              --worker "${CLOUDFLARE_WORKER_NAME}" \
              --body "${deployment_body}"; then
              break
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "::warning::cf workers deployments create attempt ${attempt} failed, retrying in 15s..."
              sleep 15
            else
              echo "::error::All 3 cf workers deployments create attempts failed."
              exit 1
            fi
          done
