# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "npm" # See documentation for possible values
    directory: "/" # Location of package manifests
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    commit-message:
      prefix: "fix"
      prefix-development: "chore"
      include: "scope"
    ignore:
      # tsdown 0.23.2 ships rolldown-plugin-dts 0.29 beta, which drops the
      # TypeScript 7.0 tsgo path and fails declaration builds.
      - dependency-name: "tsdown"
        versions: ["0.23.2"]
      # Vite plugin 1.65 removes experimental.newConfig (cloudflare.config.ts);
      # moving past it requires migrating to the v2 plugin.
      - dependency-name: "@cloudflare/vite-plugin"
        versions: [">=1.65.0"]
      # @effect/opentelemetry caps the OpenTelemetry SDK below 3.0/0.300.
      - dependency-name: "@opentelemetry/resources"
        versions: [">=3.0.0"]
      - dependency-name: "@opentelemetry/sdk-metrics"
        versions: [">=3.0.0"]
      - dependency-name: "@opentelemetry/exporter-*-otlp-http"
        versions: [">=0.300.0"]
    groups:
      production-dependencies:
        dependency-type: "production"
      development-dependencies:
        dependency-type: "development"

  - package-ecosystem: "github-actions" # See documentation for possible values
    directory: "/" # Location of package manifests
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    commit-message:
      prefix: "ci"
    groups:
      all-actions:
        patterns:
          - "*"
