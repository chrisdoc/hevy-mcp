name: Build and Test

on:
  push:
    branches:
      - main
  pull_request:
    # Stacked PRs target their parent branch, not only main.

permissions:
  contents: read

env:
  ROLLUP_SKIP_NODEJS_NATIVE_BUILD: "true"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

# Cancel superseded first-attempt runs of the same PR only. Re-runs and other
# events get a unique group (run_id), so re-running an older commit never
# cancels the current head, and main pushes, schedules, and manual runs never
# queue or cancel.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.run_attempt == 1 && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  upload-source-event:
    name: Upload source event
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Upload source event
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: source-event
          path: ${{ github.event_path }}
          if-no-files-found: error

  unit:
    name: Unit tests (Node 24.x)
    runs-on: ubuntu-24.04
    # Nx 23 reads these self-hosted names. Require both repository secrets so
    # fork PRs, or partially configured environments, use only local caching.
    env:
      NX_SELF_HOSTED_REMOTE_CACHE_ACCESS_TOKEN: ${{ secrets.NX_REMOTE_CACHE_TOKEN != '' && secrets.NX_REMOTE_CACHE_SERVER != '' && secrets.NX_REMOTE_CACHE_TOKEN || '' }}
      NX_SELF_HOSTED_REMOTE_CACHE_SERVER: ${{ secrets.NX_REMOTE_CACHE_TOKEN != '' && secrets.NX_REMOTE_CACHE_SERVER != '' && secrets.NX_REMOTE_CACHE_SERVER || '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.0.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.x"
          cache: "pnpm"

      - name: Set up mise
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build package before Node 24 unit tests
        run: npx nx run repository:build

      - name: Run Node 24 unit tests
        if: ${{ !cancelled() }}
        env:
          HEVY_API_KEY: ""
          SENTRY_DSN: ""
          OTEL_COLLECTOR_TOKEN: ""
          HEVY_TEST_REPORT_MODE: ci
        run: >-
          npx nx run-many --projects=repository --targets=test:unit --parallel=4 --outputStyle=stream --excludeTaskDependencies

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./test-results/unit-tests.xml
          disable_search: true
          report_type: test_results

      - name: Upload unit test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-test-results-node-24
          path: test-results/unit-tests.xml
          if-no-files-found: warn

      - name: Upload unit coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/unit/lcov.info

  validate:
    name: Validation graph (Node 24.x)
    runs-on: ubuntu-24.04
    # Nx 23 reads these self-hosted names. Require both repository secrets so
    # fork PRs, or partially configured environments, use only local caching.
    env:
      NX_SELF_HOSTED_REMOTE_CACHE_ACCESS_TOKEN: ${{ secrets.NX_REMOTE_CACHE_TOKEN != '' && secrets.NX_REMOTE_CACHE_SERVER != '' && secrets.NX_REMOTE_CACHE_TOKEN || '' }}
      NX_SELF_HOSTED_REMOTE_CACHE_SERVER: ${{ secrets.NX_REMOTE_CACHE_TOKEN != '' && secrets.NX_REMOTE_CACHE_SERVER != '' && secrets.NX_REMOTE_CACHE_SERVER || '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.0.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.x"
          cache: "pnpm"

      - name: Set up mise
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify commit messages
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          # pull_request.base.sha freezes at PR-open time, so after main moves
          # the range re-lints already-merged history; lint from merge-base instead.
          npx commitlint --from "$(git merge-base "origin/${BASE_REF}" HEAD)" --to HEAD --verbose

      - name: Check for changeset
        if: >-
          github.event_name == 'pull_request' &&
          github.actor != 'dependabot[bot]' &&
          github.head_ref != 'changeset-release/main'
        env:
          CHANGESET_BASE_REF: origin/${{ github.event.pull_request.base.ref }}
        run: pnpm run check:changeset

      - name: Build package before Node 24 validation
        run: npx nx run repository:build

      - name: Run Node 24 validation graph
        if: ${{ !cancelled() }}
        env:
          HEVY_API_KEY: ""
          SENTRY_DSN: ""
          OTEL_COLLECTOR_TOKEN: ""
          HEVY_TEST_REPORT_MODE: ci
        run: >-
          npx nx run-many --projects=repository --targets=check:types,check,worker:dry-run,test:worker-http,test:contract,test:cli,test:worker,test:mcp,check:control-plane,check:exports,check:boundaries --parallel=4 --outputStyle=stream --excludeTaskDependencies

      - name: Upload mocked coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/mocked/lcov.info

  # Required-check verdict. Its rendered name is the branch-protection check,
  # so it stays "Build and test (Node 24.x)" while the work runs in parallel jobs.
  build:
    name: Build and test (Node 24.x)
    if: always()
    needs: [unit, validate]
    runs-on: ubuntu-24.04
    steps:
      - name: Require unit and validation jobs to succeed
        env:
          UNIT_RESULT: ${{ needs.unit.result }}
          VALIDATE_RESULT: ${{ needs.validate.result }}
        run: |
          echo "unit: ${UNIT_RESULT}"
          echo "validate: ${VALIDATE_RESULT}"
          if [ "${UNIT_RESULT}" != "success" ] || [ "${VALIDATE_RESULT}" != "success" ]; then
            echo "A required job did not succeed." >&2
            exit 1
          fi

  package-performance:
    name: Package and performance (Node 24.x)
    runs-on: ubuntu-24.04
    # Nx 23 reads these self-hosted names. Require both repository secrets so
    # fork PRs, or partially configured environments, use only local caching.
    env:
      NX_SELF_HOSTED_REMOTE_CACHE_ACCESS_TOKEN: ${{ secrets.NX_REMOTE_CACHE_TOKEN != '' && secrets.NX_REMOTE_CACHE_SERVER != '' && secrets.NX_REMOTE_CACHE_TOKEN || '' }}
      NX_SELF_HOSTED_REMOTE_CACHE_SERVER: ${{ secrets.NX_REMOTE_CACHE_TOKEN != '' && secrets.NX_REMOTE_CACHE_SERVER != '' && secrets.NX_REMOTE_CACHE_SERVER || '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.0.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.x"
          cache: "pnpm"

      - name: Set up mise
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build package candidate
        run: npx nx run repository:build
        env:
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          OTEL_COLLECTOR_TOKEN: ${{ secrets.OTEL_COLLECTOR_TOKEN }}
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Prepare shared package candidates
        if: ${{ !cancelled() }}
        run: |
          npx nx run @chrisdoc/hevy-cli:build
          npx nx run repository:check:server-manifest
          npx nx run repository:pack:artifacts --excludeTaskDependencies

      - name: Run isolated performance validation
        if: ${{ !cancelled() }}
        env:
          HEVY_API_KEY: ""
          SENTRY_DSN: ""
          OTEL_COLLECTOR_TOKEN: ""
        run: npx nx run repository:test:performance --excludeTaskDependencies

      - name: Run package validation graph
        if: ${{ !cancelled() }}
        env:
          HEVY_API_KEY: ""
          SENTRY_DSN: ""
          OTEL_COLLECTOR_TOKEN: ""
        run: >-
          npx nx run-many --projects=repository --targets=test:diagnostics,test:stdio,test:pack,test:pack:cli,check:publint --parallel=3 --outputStyle=stream --excludeTaskDependencies

      - name: Upload performance summary
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: performance-summary-node-24
          path: test-results/performance/summary.json
          if-no-files-found: error

  docker:
    name: Build and smoke test Docker image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: hevy-mcp:ci
          cache-from: type=gha,scope=hevy-mcp-ci
          cache-to: type=gha,mode=max,scope=hevy-mcp-ci,ignore-error=true

      - name: Smoke test version output without an API key
        run: docker run --rm hevy-mcp:ci --version

      - name: Smoke test help output without an API key
        run: docker run --rm hevy-mcp:ci --help

      - name: Verify hardened runtime structure
        run: |
          docker run --rm --entrypoint sh hevy-mcp:ci -c '
            test "$(id -u)" -ne 0 &&
            test ! -e /app/node_modules &&
            test -f /app/standalone.mjs
          '

  otel-cicd-action:
    if: always()
    name: OpenTelemetry Export Trace
    runs-on: ubuntu-latest
    needs: [build, unit, validate, package-performance, docker]
    env:
      OTEL_COLLECTOR_TOKEN: ${{ secrets.OTEL_COLLECTOR_TOKEN }}
    steps:
      - name: Export workflow
        # The collector token exists only in chrisdoc/hevy-mcp, and fork PRs
        # run without secrets — skip the export when the token is absent
        # instead of failing the whole workflow.
        if: env.OTEL_COLLECTOR_TOKEN != ''
        uses: corentinmusard/otel-cicd-action@4826b79d63662fa91657272e7711420cb6aea543 # v4.2.0
        with:
          otlpEndpoint: "https://otel.chrisdoc.dev/v1/traces"
          otlpHeaders: "Authorization=Bearer ${{ env.OTEL_COLLECTOR_TOKEN }}"
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          runId: ${{ github.run_id }}
