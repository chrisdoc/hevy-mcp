name: Workflow Lint

on:
  push:
    branches:
      - main
  pull_request:
    # Stacked PRs target their parent branch, not only main.
  workflow_dispatch:

permissions: {}

jobs:
  jactionlint:
    name: Lint workflow syntax
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up jactionlint
        uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          install_args: jactionlint

      - name: Run jactionlint
        run: jactionlint --format github

  zizmor:
    name: Audit workflows and actions
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up zizmor
        uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          install_args: zizmor

      - name: Run zizmor
        run: zizmor --strict-collection --collect=default --format=github .

      - name: Generate zizmor SARIF report
        if: ${{ !cancelled() }}
        run: zizmor --strict-collection --collect=default --format=sarif --no-exit-codes . > zizmor.sarif

      - name: Upload zizmor report
        if: ${{ !cancelled() }}
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: zizmor.sarif
