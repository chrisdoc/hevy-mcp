# Git hooks managed by lefthook. Enable once per clone: `mise exec -- lefthook install`
# Entire's git hooks are chained as steps here, so never run `entire enable --force`
# (it would overwrite these .git/hooks scripts; re-run `mise exec -- lefthook install` instead).
# All tools resolve through `mise exec --` so hooks work without mise activated in the shell.
pre-commit:
  parallel: false
  commands:
    oxlint:
      glob: "**/*.{js,ts,cjs,mjs,cts,mts,d.cts,d.mts,jsx,tsx}"
      run: mise exec -- npx oxlint --type-aware --type-check .
    oxfmt:
      # lefthook ignores `exclude` when computing the implicit file list, so filter
      # the generated .pi extension here; exit 0 when nothing formatable remains.
      glob: "**/*.{js,ts,cjs,mjs,cts,mts,d.cts,d.mts,jsx,tsx,json,jsonc,md}"
      run: |
        staged=$(echo "{staged_files}" | tr ' ' '\n' | grep -v '^\.pi/' || true)
        [ -z "$staged" ] && exit 0
        mise exec -- npx oxfmt --write $staged
      stage_fixed: true
    actionlint:
      glob:
        - ".github/workflows/**/*.yml"
        - ".github/workflows/**/*.yaml"
      run: mise exec -- actionlint
    zizmor:
      glob:
        - ".github/dependabot.yml"
        - ".github/workflows/**/*.yml"
        - ".github/workflows/**/*.yaml"
        - "**/action.yml"
        - "**/action.yaml"
      run: mise exec -- zizmor --offline --strict-collection --collect=default --format=plain {staged_files}
    tests:
      run: mise exec -- npm run test:unit

prepare-commit-msg:
  commands:
    entire:
      run: mise exec -- entire hooks git prepare-commit-msg {1} || true

commit-msg:
  commands:
    entire:
      run: mise exec -- entire hooks git commit-msg {1} || true
    commitlint:
      run: mise exec -- npx commitlint --edit {1}

post-commit:
  commands:
    entire:
      run: mise exec -- entire hooks git post-commit || true

post-rewrite:
  commands:
    entire:
      run: mise exec -- entire hooks git post-rewrite {1} || true

pre-push:
  scripts:
    "entire.sh":
      runner: bash
      use_stdin: true
    "control-plane.sh":
      runner: bash
